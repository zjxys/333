<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽球人的世界 · 欢迎进入</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --teal-darkest: #050f0d;
            --teal-dark: #0a1a17;
            --teal-mid: #0d2622;
            --jade: #5fb3a1;
            --jade-dim: #3d8a72;
            --accent: #74b9ff;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--teal-darkest);
            font-family: 'Georgia', 'Noto Serif SC', serif;
        }

        /* ====== 渐变背景 ====== */
        .bg-gradient {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 60%, var(--teal-mid) 0%, var(--teal-dark) 40%, var(--teal-darkest) 100%);
            z-index: 0;
        }

        /* ====== Canvas 粒子 ====== */
        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* ====== 光晕 ====== */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            pointer-events: none;
            animation: orbPulse 6s ease-in-out infinite;
        }

        .glow-orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(95, 179, 161, 0.12);
            top: 10%;
            left: 5%;
        }

        .glow-orb-2 {
            width: 350px;
            height: 350px;
            background: rgba(116, 185, 255, 0.08);
            bottom: 10%;
            right: 5%;
            animation-delay: -3s;
        }

        @keyframes orbPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 0.9; }
        }

        /* ====== 中心内容 ====== */
        .intro-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
        }

        /* ====== Logo 圆环 ====== */
        .logo-ring {
            position: relative;
            width: 140px;
            height: 140px;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: logoAppear 1s ease 0.3s forwards;
        }

        .logo-ring::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--jade);
            border-right-color: var(--jade);
            animation: ringSpin 2s linear infinite;
        }

        .logo-ring::after {
            content: '';
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            border: 1px solid rgba(95, 179, 161, 0.2);
            animation: ringPulse 2.5s ease-in-out infinite;
        }

        .logo-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--teal-mid), var(--teal-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            box-shadow: 0 0 40px rgba(95, 179, 161, 0.3), inset 0 0 20px rgba(0,0,0,0.5);
            border: 2px solid rgba(95, 179, 161, 0.3);
        }

        @keyframes logoAppear {
            from { opacity: 0; transform: scale(0.5) rotate(-180deg); }
            to { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        @keyframes ringSpin {
            to { transform: rotate(360deg); }
        }

        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.6; }
        }

        /* ====== 标题 ====== */
        .intro-title {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            margin-bottom: 0.8rem;
            opacity: 0;
            animation: textRise 1s ease 0.6s forwards;
            letter-spacing: 0.05em;
        }

        .intro-title .accent {
            color: var(--jade);
            font-style: italic;
        }

        .intro-subtitle {
            font-size: clamp(0.85rem, 2vw, 1.1rem);
            color: rgba(255, 255, 255, 0.35);
            text-align: center;
            margin-bottom: 3rem;
            letter-spacing: 0.1em;
            opacity: 0;
            animation: textRise 1s ease 0.9s forwards;
        }

        @keyframes textRise {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ====== 进入按钮 ====== */
        .enter-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1rem 3rem;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: inherit;
            color: var(--jade);
            background: transparent;
            border: 2px solid var(--jade);
            border-radius: 50px;
            cursor: pointer;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
            animation: btnAppear 1s ease 1.3s forwards;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1;
        }

        .enter-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--jade), var(--jade-dim));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .enter-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(95, 179, 161, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
            z-index: -1;
        }

        .enter-btn:hover {
            color: #fff;
            border-color: var(--jade);
            box-shadow: 0 10px 40px rgba(95, 179, 161, 0.4), 0 0 20px rgba(95, 179, 161, 0.2);
            transform: translateY(-3px) scale(1.03);
        }

        .enter-btn:hover::before { opacity: 1; }

        .enter-btn:hover::after {
            width: 400px;
            height: 400px;
        }

        .enter-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        .enter-btn .arrow {
            display: inline-block;
            transition: transform 0.4s ease;
        }

        .enter-btn:hover .arrow {
            transform: translateX(8px);
        }

        @keyframes btnAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ====== 加载点 ====== */
        .loading-dots {
            display: flex;
            gap: 0.5rem;
            margin-top: 2.5rem;
            opacity: 0;
            animation: dotsAppear 1s ease 1.6s forwards;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--jade);
            opacity: 0.3;
            animation: dotBlink 1.5s ease-in-out infinite;
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotsAppear { to { opacity: 1; } }

        @keyframes dotBlink {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.3); }
        }

        /* ====== 底部提示 ====== */
        .footer-hint {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            white-space: nowrap;
            opacity: 0;
            animation: textRise 1s ease 2s forwards;
        }

        /* ====== 退出过渡 ====== */
        .exit-overlay {
            position: fixed;
            inset: 0;
            background: var(--teal-darkest);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .exit-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        /* ====== 响应式 ====== */
        @media (max-width: 768px) {
            .logo-ring { width: 100px; height: 100px; margin-bottom: 1.5rem; }
            .logo-inner { font-size: 2.5rem; }
            .glow-orb { display: none; }
        }

        /* ====== prefers-reduced-motion ====== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
            #particleCanvas { display: none; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <canvas id="particleCanvas"></canvas>

    <div class="intro-container">
        <div class="logo-ring">
            <div class="logo-inner">🏸</div>
        </div>

        <h1 class="intro-title">
            欢迎来到<span class="accent">羽球人的世界</span>
        </h1>

        <p class="intro-subtitle">2026级 武夷学院电气班 · 周剑的个人主页</p>

        <button class="enter-btn" id="enterBtn" onclick="enterSite()">
            <span>进入主页</span>
            <span class="arrow">→</span>
        </button>

        <div class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <p class="footer-hint">Designed with passion · 2026</p>
    </div>

    <div class="exit-overlay" id="exitOverlay"></div>

    <script>
        // ====== Canvas 粒子背景 ======
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.scale(dpr, dpr);
        }
        resize();
        window.addEventListener('resize', resize);

        // 粒子
        const particles = [];
        const particleCount = 50;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * W,
                y: Math.random() * H,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.3,
                r: Math.random() * 2 + 0.5,
                opacity: Math.random() * 0.3 + 0.1
            });
        }

        function drawParticles() {
            if (prefersReducedMotion) return;

            ctx.clearRect(0, 0, W, H);

            // 粒子
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0) p.x = W;
                if (p.x > W) p.x = 0;
                if (p.y < 0) p.y = H;
                if (p.y > H) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(0.1, p.r), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(95, 179, 161, ${p.opacity})`;
                ctx.fill();
            });

            // 连线
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 130) {
                        const op = (1 - dist / 130) * 0.08;
                        ctx.strokeStyle = `rgba(95, 179, 161, ${op})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(drawParticles);
        }

        if (!prefersReducedMotion) drawParticles();

        // ====== 进入按钮 ======
        let isExiting = false;

        function enterSite() {
            if (isExiting) return;
            isExiting = true;

            const overlay = document.getElementById('exitOverlay');

            // 淡出动画
            overlay.classList.add('active');

            // 隐藏内容
            const container = document.querySelector('.intro-container');
            container.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
            container.style.opacity = '0';
            container.style.transform = 'scale(0.95)';

            // 延迟跳转
            setTimeout(() => {
                window.location.href = 'personal-website.html';
            }, 900);
        }

        // 键盘 Enter 键也可进入
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !isExiting) {
                enterSite();
            }
        });

        // ====== 鼠标视差光晕 ======
        const orbs = document.querySelectorAll('.glow-orb');
        let mouseTicking = false;

        document.addEventListener('mousemove', (e) => {
            if (!mouseTicking) {
                requestAnimationFrame(() => {
                    const x = (e.clientX / window.innerWidth - 0.5) * 30;
                    const y = (e.clientY / window.innerHeight - 0.5) * 30;
                    orbs.forEach((orb, i) => {
                        const factor = i === 0 ? 1 : -1;
                        orb.style.transform = `translate(${x * factor}px, ${y * factor}px)`;
                    });
                    mouseTicking = false;
                });
                mouseTicking = true;
            }
        });
    </script>
</body>
</html>
