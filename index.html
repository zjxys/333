<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽球人的世界 · 欢迎进入</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-lightest: #e0f4ff;
            --bg-light: #d6ecfa;
            --bg-mid: #c5e3f7;
            --accent: #0984e3;
            --accent2: #74b9ff;
            --accent3: #00cec9;
            --accent-soft: rgba(116, 185, 255, 0.12);
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-lightest);
            font-family: 'Georgia', 'Noto Serif SC', serif;
        }

        /* ====== 渐变背景 ====== */
        .bg-gradient {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #e0f4ff 0%, #d6ecfa 25%, #c5e3f7 50%, #d6ecfa 75%, #e0f4ff 100%);
            background-size: 400% 400%;
            z-index: 0;
            animation: bgFlow 15s ease infinite;
        }

        @keyframes bgFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ====== 动态波浪装饰 ====== */
        .wave-deco {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            z-index: 1;
            pointer-events: none;
            opacity: 0.5;
        }

        .wave-deco svg { width: 100%; height: 100%; }

        .wave-deco path {
            animation: waveMove 8s linear infinite;
        }

        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* ====== Canvas 粒子 ====== */
        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* ====== 光晕 ====== */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            pointer-events: none;
            animation: orbPulse 6s ease-in-out infinite;
        }

        .glow-orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(116, 185, 255, 0.2);
            top: 10%;
            left: 5%;
        }

        .glow-orb-2 {
            width: 350px;
            height: 350px;
            background: rgba(0, 206, 201, 0.15);
            bottom: 10%;
            right: 5%;
            animation-delay: -3s;
        }

        @keyframes orbPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 0.9; }
        }

        /* ====== 中心内容 ====== */
        .intro-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
        }

        /* ====== Logo 圆环 ====== */
        .logo-ring {
            position: relative;
            width: 160px;
            height: 160px;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: logoAppear 1s ease 0.3s forwards, logoFloat 4s ease-in-out 1.3s infinite;
        }

        .logo-ring::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--accent);
            border-right-color: var(--accent3);
            animation: ringSpin 2s linear infinite;
        }

        .logo-ring::after {
            content: '';
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            border: 1px solid rgba(116, 185, 255, 0.2);
            animation: ringPulse 2.5s ease-in-out infinite;
        }

        .logo-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #fff, var(--bg-light));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(116, 185, 255, 0.4), inset 0 0 20px rgba(255,255,255,0.8);
            border: 2px solid rgba(116, 185, 255, 0.4);
            position: relative;
            overflow: hidden;
        }

        .logo-svg {
            width: 80%;
            height: 80%;
            animation: logoSvgFloat 3s ease-in-out infinite;
        }

        .logo-svg .shuttlecock {
            animation: shuttleSpin 4s ease-in-out infinite;
            transform-origin: center;
        }

        .logo-svg .feather {
            animation: featherShimmer 2s ease-in-out infinite;
        }

        .logo-svg .cork {
            animation: corkPulse 2s ease-in-out infinite;
        }

        @keyframes logoAppear {
            from { opacity: 0; transform: scale(0.5) rotate(-180deg); }
            to { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes logoSvgFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-3px) rotate(5deg); }
            66% { transform: translateY(2px) rotate(-3deg); }
        }

        @keyframes shuttleSpin {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(8deg) scale(1.05); }
        }

        @keyframes featherShimmer {
            0%, 100% { opacity: 0.85; }
            50% { opacity: 1; }
        }

        @keyframes corkPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        @keyframes ringSpin {
            to { transform: rotate(360deg); }
        }

        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.6; }
        }

        /* ====== 标题 ====== */
        .intro-title {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 700;
            color: #2d3436;
            text-align: center;
            margin-bottom: 0.8rem;
            opacity: 0;
            animation: textRise 1s ease 0.6s forwards, titleGlow 3s ease-in-out 1.6s infinite;
            letter-spacing: 0.05em;
        }

        .intro-title .accent {
            background: linear-gradient(135deg, var(--accent), var(--accent3), var(--accent2));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-style: italic;
            animation: accentFlow 3s ease infinite;
        }

        @keyframes accentFlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 0 rgba(116, 185, 255, 0); }
            50% { text-shadow: 0 0 20px rgba(116, 185, 255, 0.3); }
        }

        .intro-subtitle {
            font-size: clamp(0.85rem, 2vw, 1.1rem);
            color: #636e72;
            text-align: center;
            margin-bottom: 3rem;
            letter-spacing: 0.1em;
            opacity: 0;
            animation: textRise 1s ease 0.9s forwards;
        }

        @keyframes textRise {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ====== 进入按钮 ====== */
        .enter-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1.1rem 3.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: inherit;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none;
            border-radius: 50px;
            cursor: pointer;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
            animation: btnAppear 1s ease 1.3s forwards;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1;
            letter-spacing: 0.08em;
            box-shadow: 0 8px 30px rgba(9, 132, 227, 0.3);
        }

        /* 渐变边框层 */
        .enter-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50px;
            padding: 2px;
            background: linear-gradient(135deg, var(--accent2), var(--accent3), var(--accent));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: 0;
            animation: borderShimmer 3s linear infinite;
            background-size: 200% 200%;
        }

        @keyframes borderShimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* 流光填充层 */
        .enter-btn-glow {
            position: absolute;
            inset: 0;
            border-radius: 50px;
            background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.3) 50%, transparent 70%);
            background-size: 200% 100%;
            background-position: -100% 0;
            transition: background-position 0.8s ease;
            z-index: 0;
        }

        .enter-btn:hover .enter-btn-glow {
            background-position: 200% 0;
        }

        /* 底色填充层 */
        .enter-btn-fill {
            position: absolute;
            inset: 0;
            border-radius: 50px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(116, 185, 255, 0.1));
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 0;
        }

        .enter-btn:hover .enter-btn-fill {
            opacity: 1;
        }

        /* 呼吸脉冲 */
        .enter-btn-pulse {
            position: absolute;
            inset: 0;
            border-radius: 50px;
            border: 2px solid var(--accent2);
            opacity: 0;
            animation: btnPulse 2.5s ease-out infinite;
            z-index: -1;
        }

        @keyframes btnPulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .enter-btn:hover {
            color: #fff;
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 15px 50px rgba(9, 132, 227, 0.4), 0 0 30px rgba(0, 206, 201, 0.2);
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
        }

        .enter-btn:active {
            transform: translateY(-1px) scale(0.98);
            transition: transform 0.1s ease;
        }

        .enter-btn .arrow {
            display: inline-block;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            z-index: 1;
        }

        .enter-btn:hover .arrow {
            transform: translateX(10px) rotate(360deg);
        }

        .enter-btn span:not(.arrow):not(.enter-btn-glow):not(.enter-btn-fill):not(.enter-btn-pulse) {
            position: relative;
            z-index: 1;
        }

        @keyframes btnAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ====== 加载点 ====== */
        .loading-dots {
            display: flex;
            gap: 0.5rem;
            margin-top: 2.5rem;
            opacity: 0;
            animation: dotsAppear 1s ease 1.6s forwards;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent2);
            opacity: 0.3;
            animation: dotBlink 1.5s ease-in-out infinite;
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotsAppear { to { opacity: 1; } }

        @keyframes dotBlink {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.3); }
        }

        /* ====== 底部提示 ====== */
        .footer-hint {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: rgba(45, 52, 54, 0.3);
            white-space: nowrap;
            opacity: 0;
            animation: textRise 1s ease 2s forwards;
        }

        /* ====== 退出过渡 ====== */
        .exit-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-lightest);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .exit-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        /* ====== 响应式 ====== */
        @media (max-width: 768px) {
            .logo-ring { width: 100px; height: 100px; margin-bottom: 1.5rem; }
            .logo-inner { font-size: 2.5rem; }
            .glow-orb { display: none; }
        }

        /* ====== prefers-reduced-motion ====== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
            #particleCanvas { display: none; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <canvas id="particleCanvas"></canvas>

    <!-- 底部波浪装饰 -->
    <div class="wave-deco">
        <svg viewBox="0 0 2880 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,60 C360,100 720,20 1440,60 C2160,100 2520,20 2880,60 L2880,120 L0,120 Z"
                  fill="rgba(116, 185, 255, 0.15)"/>
            <path d="M0,80 C360,40 720,100 1440,70 C2160,40 2520,100 2880,70 L2880,120 L0,120 Z"
                  fill="rgba(0, 206, 201, 0.1)"/>
        </svg>
    </div>

    <div class="intro-container">
        <div class="logo-ring">
            <div class="logo-inner">
                <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- 羽毛球拍椭圆框 -->
                    <ellipse cx="50" cy="50" rx="38" ry="42" fill="none" stroke="#0984e3" stroke-width="2.5" opacity="0.3"/>
                    <!-- 球拍网线 - 竖线 -->
                    <line x1="50" y1="12" x2="50" y2="88" stroke="#74b9ff" stroke-width="0.6" opacity="0.25"/>
                    <line x1="35" y1="18" x2="35" y2="82" stroke="#74b9ff" stroke-width="0.5" opacity="0.2"/>
                    <line x1="65" y1="18" x2="65" y2="82" stroke="#74b9ff" stroke-width="0.5" opacity="0.2"/>
                    <line x1="22" y1="30" x2="22" y2="70" stroke="#74b9ff" stroke-width="0.4" opacity="0.15"/>
                    <line x1="78" y1="30" x2="78" y2="70" stroke="#74b9ff" stroke-width="0.4" opacity="0.15"/>
                    <!-- 球拍网线 - 横线 -->
                    <line x1="14" y1="50" x2="86" y2="50" stroke="#74b9ff" stroke-width="0.6" opacity="0.25"/>
                    <line x1="18" y1="35" x2="82" y2="35" stroke="#74b9ff" stroke-width="0.5" opacity="0.2"/>
                    <line x1="18" y1="65" x2="82" y2="65" stroke="#74b9ff" stroke-width="0.5" opacity="0.2"/>

                    <!-- 羽毛球主体 -->
                    <g class="shuttlecock">
                        <!-- 羽毛 -->
                        <g class="feather">
                            <path d="M50,20 L42,55 L50,52 L58,55 Z" fill="#fff" stroke="#dfe6e9" stroke-width="0.5"/>
                            <path d="M50,20 L38,50 L44,50 L50,48 L56,50 L62,50 Z" fill="#f5f6fa" stroke="#dfe6e9" stroke-width="0.4" opacity="0.9"/>
                            <line x1="50" y1="20" x2="50" y2="48" stroke="#b2bec3" stroke-width="0.5" opacity="0.4"/>
                            <line x1="50" y1="22" x2="44" y2="48" stroke="#b2bec3" stroke-width="0.3" opacity="0.3"/>
                            <line x1="50" y1="22" x2="56" y2="48" stroke="#b2bec3" stroke-width="0.3" opacity="0.3"/>
                            <line x1="50" y1="25" x2="40" y2="47" stroke="#b2bec3" stroke-width="0.3" opacity="0.25"/>
                            <line x1="50" y1="25" x2="60" y2="47" stroke="#b2bec3" stroke-width="0.3" opacity="0.25"/>
                        </g>
                        <!-- 软木球头 -->
                        <g class="cork">
                            <circle cx="50" cy="58" r="9" fill="#0984e3" opacity="0.9"/>
                            <circle cx="50" cy="58" r="9" fill="none" stroke="#fff" stroke-width="1.5"/>
                            <ellipse cx="47" cy="55" rx="3" ry="2" fill="rgba(255,255,255,0.4)"/>
                        </g>
                    </g>

                    <!-- 装饰光点 -->
                    <circle cx="25" cy="25" r="1.5" fill="#74b9ff" opacity="0.4">
                        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="75" cy="75" r="1.5" fill="#00cec9" opacity="0.4">
                        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="78" cy="22" r="1" fill="#0984e3" opacity="0.3">
                        <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3s" repeatCount="indefinite"/>
                    </circle>
                </svg>
            </div>
        </div>

        <h1 class="intro-title">
            欢迎来到<span class="accent">羽球人的世界</span>
        </h1>

        <p class="intro-subtitle">2026级 武夷学院电气班 · 周剑的个人主页</p>

        <button class="enter-btn" id="enterBtn" onclick="enterSite()">
            <span class="enter-btn-pulse"></span>
            <span class="enter-btn-glow"></span>
            <span class="enter-btn-fill"></span>
            <span>进入主页</span>
            <span class="arrow">→</span>
        </button>

        <div class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <p class="footer-hint">Designed with passion · 2026</p>
    </div>

    <div class="exit-overlay" id="exitOverlay"></div>

    <script>
        // ====== Canvas 粒子背景 ======
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.scale(dpr, dpr);
        }
        resize();
        window.addEventListener('resize', resize);

        // 粒子
        const particles = [];
        const particleCount = 50;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * W,
                y: Math.random() * H,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.3,
                r: Math.random() * 2 + 0.5,
                opacity: Math.random() * 0.3 + 0.1
            });
        }

        function drawParticles() {
            if (prefersReducedMotion) return;

            ctx.clearRect(0, 0, W, H);

            // 粒子
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0) p.x = W;
                if (p.x > W) p.x = 0;
                if (p.y < 0) p.y = H;
                if (p.y > H) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(0.1, p.r), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(9, 132, 227, ${p.opacity})`;
                ctx.fill();
            });

            // 连线
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 130) {
                        const op = (1 - dist / 130) * 0.08;
                        ctx.strokeStyle = `rgba(9, 132, 227, ${op})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(drawParticles);
        }

        if (!prefersReducedMotion) drawParticles();

        // ====== 进入按钮 ======
        let isExiting = false;

        function enterSite() {
            if (isExiting) return;
            isExiting = true;

            const overlay = document.getElementById('exitOverlay');

            // 淡出动画
            overlay.classList.add('active');

            // 隐藏内容
            const container = document.querySelector('.intro-container');
            container.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
            container.style.opacity = '0';
            container.style.transform = 'scale(0.95)';

            // 延迟跳转
            setTimeout(() => {
                window.location.href = 'personal-website.html';
            }, 900);
        }

        // 键盘 Enter 键也可进入
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !isExiting) {
                enterSite();
            }
        });

        // ====== 鼠标视差光晕 ======
        const orbs = document.querySelectorAll('.glow-orb');
        let mouseTicking = false;

        document.addEventListener('mousemove', (e) => {
            if (!mouseTicking) {
                requestAnimationFrame(() => {
                    const x = (e.clientX / window.innerWidth - 0.5) * 30;
                    const y = (e.clientY / window.innerHeight - 0.5) * 30;
                    orbs.forEach((orb, i) => {
                        const factor = i === 0 ? 1 : -1;
                        orb.style.transform = `translate(${x * factor}px, ${y * factor}px)`;
                    });
                    mouseTicking = false;
                });
                mouseTicking = true;
            }
        });
    </script>
</body>
</html>
